# Merged into base-interface's compose.yaml by compose.base.yaml (#30).
#
# base-interface's open-webui depends on base-inference's litellm being
# healthy before it starts. Neither layer's own compose.yaml can declare that:
# base-interface's file does not define litellm, and a depends_on naming an
# undefined service makes Compose refuse the file even standalone (verified:
# `docker compose config` in base-interface alone errors on it, with or
# without `required: false`). Only the composition, which includes both, can
# add the wait back.
services:
  open-webui:
    depends_on:
      litellm:
        condition: service_healthy
