# The whole base, composed from the five layers.
#
#   docker compose -f compose.base.yaml up -d      all five layers
#   docker compose up -d                           this layer alone
#
# Each layer owns the services it runs, in its own repository, in its own
# compose.yaml. This file only says which layers take part. A service defined
# here instead of in its layer is a service two teams edit.
#
# LAYOUT THIS FILE ASSUMES: the repositories are siblings on disk, each in a
# directory named after itself.
#
#     <somewhere>/
#     ├── base-platform/     ← you are here
#     ├── base-knowledge/
#     ├── base-inference/
#     ├── base-agents/
#     └── base-interface/
#
# Compose resolves `include` relative to this file and cannot fetch a
# repository. If your checkout sits elsewhere, set BASE_ROOT.
#
# The directory name matters and is easy to get wrong: a clone made before a
# repository was renamed keeps the old directory name, and the failure is
# `no such file or directory` pointing at a path that looks right.
#
# This is the development composition. Production is Kubernetes, and the layer
# fragments are the source the manifests are generated from — see
# docs/ARCHITECTURE.md.

include:
  - path: ${BASE_ROOT:-..}/base-knowledge/compose.yaml
  - path: ${BASE_ROOT:-..}/base-inference/docker-compose.yml
  - path: ${BASE_ROOT:-..}/base-agents/compose.yaml
  - path: ${BASE_ROOT:-..}/base-interface/compose.yaml
  - path: ./compose.yaml

# Each layer publishes the targets it wants scraped, in its own repository.
# THIS is the file that knows all five exist, so this is where those files get
# mounted into the backend. Putting the mount in compose.yaml would make the
# platform layer's own fragment name the other layers; putting it in a layer's
# fragment would make that layer redefine a service it does not own.
services:
  prometheus:
    volumes:
      - ${BASE_ROOT:-..}/base-knowledge/observability/scrape.d/knowledge.yml:/etc/prometheus/scrape.d/knowledge.yml:ro
      - ${BASE_ROOT:-..}/base-inference/observability/scrape.d/inference.yml:/etc/prometheus/scrape.d/inference.yml:ro
      - ${BASE_ROOT:-..}/base-agents/observability/scrape.d/agents.yml:/etc/prometheus/scrape.d/agents.yml:ro
      - ${BASE_ROOT:-..}/base-interface/observability/scrape.d/interface.yml:/etc/prometheus/scrape.d/interface.yml:ro

  grafana:
    volumes:
      - ${BASE_ROOT:-..}/base-inference/observability/dashboards:/etc/grafana/provisioning/dashboards/inference:ro

  # base-interface's open-webui depends on base-inference's litellm being
  # healthy before it starts. Neither layer's own compose.yaml can declare
  # that: base-interface's file does not define litellm, and a depends_on
  # naming an undefined service makes Compose refuse the file even standalone
  # (verified — `docker compose config` in base-interface alone errors on it
  # otherwise). Only this file, which includes both, can add the wait back.
  open-webui:
    depends_on:
      litellm:
        condition: service_healthy

# base-knowledge, base-agents and base-interface's fakes need base-platform's
# schemas/ mounted, same as base-inference does not (it has no schema
# dependency yet). Each layer's own compose.yaml already declares that mount
# relative to ${BASE_ROOT:-..}/base-platform, so nothing extra is needed here
# for that part — only the scrape/dashboard mounts above, which only this
# file can know how to wire.
