# Merged into base-platform's own compose.yaml by compose.base.yaml (#30).
#
# Each layer publishes the targets it wants scraped, in its own repository.
# compose.base.yaml is the file that knows all five exist, so this is where
# those files get mounted into the backend. Putting the mount in compose.yaml
# would make the platform layer's own fragment name the other layers; putting
# it in a layer's fragment would make that layer redefine a service it does
# not own.
services:
  prometheus:
    # knowledge lives on base-internal alone (base-knowledge#23): the
    # backend joins it to scrape knowledge:8001, and keeps default for the
    # rest. The interface's BFF replicas sit only on internal networks
    # (base-interface specs/interface-socket.md §3.11): the backend joins
    # interface-metrics, whose only other members they are, to scrape each.
    networks: [default, base-internal, interface-metrics]
    volumes:
      - ${BASE_ROOT:-..}/base-knowledge/observability/scrape.d/knowledge.yml:/etc/prometheus/scrape.d/knowledge.yml:ro
      - ${BASE_ROOT:-..}/base-inference/observability/scrape.d/inference.yml:/etc/prometheus/scrape.d/inference.yml:ro
      - ${BASE_ROOT:-..}/base-agents/observability/scrape.d/agents.yml:/etc/prometheus/scrape.d/agents.yml:ro
      - ${BASE_ROOT:-..}/base-interface/observability/scrape.d/interface.yml:/etc/prometheus/scrape.d/interface.yml:ro

  grafana:
    volumes:
      - ${BASE_ROOT:-..}/base-inference/observability/dashboards:/etc/grafana/provisioning/dashboards/inference:ro

# base-internal: the network with no route out, where knowledge lives
# (base-knowledge#23). Every layer that declares it declares it exactly like
# this: Compose v2 refuses two different definitions of one network across
# includes, and v5 merges them in silence (measured 2026-10-19;
# tests/test_compose_base.py checks they stay identical).
networks:
  base-internal:
    internal: true
  # Declared exactly as base-interface declares it.
  interface-metrics:
    internal: true
