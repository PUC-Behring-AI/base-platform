name: gate
# The shared gate, run by the runner rather than asserted by whoever opens the
# PR. This repository IS base-platform, so no sibling checkout is needed — the
# four layer repositories each carry a thin variant of this file that also
# checks out base-platform, matching the sibling-directory assumption
# scripts/gate.sh and compose.base.yaml both make. See docs/ADAPTATION.md §3.
#
# On a pull request it also scans the pull request's own commits — never the
# history before them — for credentials (gitleaks, #39), and the gate's name
# check reads their messages and the body; the denylist comes from a secret
# (#34).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action needs a paid licence for an organisation's
      # repositories; the release binary does the same scan. Pinned by
      # version and by the sha256 its release checksums file lists.
      - name: Scan the pull request's diff and commit messages for secrets
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="$RANGE" .
          git log --format=%B "$RANGE" | "$RUNNER_TEMP/gitleaks" stdin --no-banner --redact --verbose

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gate dependencies
        run: pip install pytest pyyaml "jsonschema[format-nongpl]" ruff

      # The chart step of the gate fails without helm and kubeconform. Pinned
      # the same way: by version and by sha256 of the release tarball.
      - name: Install helm and kubeconform
        env:
          HELM_VERSION: 4.3.1
          HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
          KUBECONFORM_VERSION: 0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$RUNNER_TEMP/helm.tgz" \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$HOME/.local/bin" --strip-components=1 linux-amd64/helm
          curl -sSfL -o "$RUNNER_TEMP/kubeconform.tgz" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tgz" -C "$HOME/.local/bin" kubeconform
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # deploy/terraform (the managed cluster) is checked with a pinned
      # Terraform, the same way: by version and by the sha256 its release
      # SHA256SUMS lists. tests/test_terraform.py runs the same checks.
      - name: Install Terraform
        env:
          TERRAFORM_VERSION: 1.17.1
          TERRAFORM_SHA256: 4638628058e71a55212b1c563712eac03b902128f40740f3dc8174df12135061
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$RUNNER_TEMP/terraform.zip" \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "$TERRAFORM_SHA256  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -o -q "$RUNNER_TEMP/terraform.zip" terraform -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check the Terraform modules (fmt, init without backend, validate)
        env:
          TF_IN_AUTOMATION: "1"
        run: |
          set -euo pipefail
          terraform fmt -check -recursive -diff deploy/terraform
          for module in deploy/terraform/*/; do
            echo "── $module"
            TF_DATA_DIR="$RUNNER_TEMP/tf-$(basename "$module")" \
              terraform -chdir="$module" init -backend=false -input=false -lockfile=readonly
            TF_DATA_DIR="$RUNNER_TEMP/tf-$(basename "$module")" \
              terraform -chdir="$module" validate
          done

      - name: Run the shared gate
        env:
          BASE_DENYLIST: ${{ secrets.BASE_DENYLIST }}
          LEAK_CHECK_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ./scripts/gate.sh
