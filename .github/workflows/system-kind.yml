name: system-kind
# The system test on a kind cluster (#84): the five base repositories side by
# side, every layer image built on the runner, the whole base brought up by
# scripts/k8s-up.sh and exercised by scripts/k8s-test.sh (docs/ADAPTATION.md
# §10).
#
# Reusable. An instance calls it from its own workflow with
# `uses: PUC-Behring-AI/base-platform/.github/workflows/system-kind.yml@vX.Y.Z`,
# `with: base_ref: vX.Y.Z` and `secrets: inherit`, adding instance_path (and
# instance_repository when the instance directory is not in base-platform).
# The @ref picks this file, not what it checks out; base_ref does that.
#
# Like harmony, it names no repository of its own: each base-* sibling is
# cloned with the read-only deploy key HARMONY_KEY_<NAME> and the repository
# variable HARMONY_SIBLINGS lists them. A missing variable or secret fails the
# run. On a pull request to base-platform itself, only changes under deploy/,
# scripts/k8s-* or this file run it: the test takes minutes.

on:
  workflow_call:
    inputs:
      base_ref:
        description: The base version the caller pins (vX.Y.Z); every base-* repository is checked out at it
        type: string
        required: true
      instance_path:
        description: The instance directory (scripts/k8s-up.sh), relative to the repository that holds it
        type: string
        default: deploy/helmfile/reference-instance
      instance_repository:
        description: owner/name of the repository that holds instance_path; empty means base-platform
        type: string
        default: ""
    secrets:
      instance_env:
        description: The instance's .env, KEY=value lines; without it throwaway values are generated for the keys of .env.example
        required: false
  pull_request:
    paths:
      - deploy/**
      - scripts/k8s-*
      - .github/workflows/system-kind.yml

permissions:
  contents: read

jobs:
  system-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_REF: ${{ inputs.base_ref || 'main' }}
      INSTANCE_PATH: ${{ inputs.instance_path || 'deploy/helmfile/reference-instance' }}
      INSTANCE_REPOSITORY: ${{ inputs.instance_repository }}
    steps:
      # base-platform's own pull request is the code under test; a caller's
      # run takes base-platform at base_ref, like every other base-*.
      - name: Check out base-platform
        uses: actions/checkout@v4
        with:
          repository: PUC-Behring-AI/base-platform
          ref: ${{ github.repository == 'PUC-Behring-AI/base-platform' && github.event_name == 'pull_request' && github.sha || (inputs.base_ref || 'main') }}
          path: base-platform

      - name: Check out the instance repository
        if: inputs.instance_repository != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.instance_repository }}
          path: instance-repository

      - name: Check out the other base-* repositories at base_ref
        env:
          SIBLINGS: ${{ vars.HARMONY_SIBLINGS }}
          KEYS: ${{ toJSON(secrets) }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "$SIBLINGS" ]; then
            echo "::error::repository variable HARMONY_SIBLINGS is not set"
            exit 1
          fi
          for name in $SIBLINGS; do
            case "$name" in
              base-platform) continue ;;
              base-*) ;;
              *) continue ;;
            esac
            secret="HARMONY_KEY_$(echo "$name" | tr '[:lower:]-' '[:upper:]_')"
            key="$(jq -r --arg s "$secret" '.[$s] // empty' <<<"$KEYS")"
            if [ -z "$key" ]; then
              echo "::error::secret $secret is not set"
              exit 1
            fi
            keyfile="$RUNNER_TEMP/$secret"
            printf '%s\n' "$key" > "$keyfile"
            chmod 600 "$keyfile"
            GIT_SSH_COMMAND="ssh -i $keyfile -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
              git clone -q --depth 1 --branch "$BASE_REF" "git@github.com:$OWNER/$name.git" "$name"
            rm -f "$keyfile"
          done

      # Each tool pinned by version and by the sha256 of its release file.
      # helm and kubeconform: the same pins as gate.yml. kubectl, docker and
      # the shasum the harness uses come with the runner.
      - name: Install kind, helm, helmfile, kubeconform and cloud-provider-kind
        env:
          KIND_VERSION: 0.33.0
          KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
          HELM_VERSION: 4.3.1
          HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
          KUBECONFORM_VERSION: 0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
          HELMFILE_VERSION: 1.8.2
          HELMFILE_SHA256: f179485c5bb9f8e20fbd8ea16d8807915988aba4d60131ee864fb3232452716e
          CPK_VERSION: 0.12.0
          CPK_SHA256: 5716aca8f01a85172c12f3b6329c70f151bec02c91b6f600c9f230845ee138e6
        run: |
          set -euo pipefail
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          fetch() { # url sha256 file
            curl -sSfL -o "$RUNNER_TEMP/$3" "$1"
            echo "$2  $RUNNER_TEMP/$3" | sha256sum -c -
          }
          fetch "https://github.com/kubernetes-sigs/kind/releases/download/v${KIND_VERSION}/kind-linux-amd64" \
            "$KIND_SHA256" kind
          install -m 0755 "$RUNNER_TEMP/kind" "$bin/kind"
          fetch "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" "$HELM_SHA256" helm.tgz
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$bin" --strip-components=1 linux-amd64/helm
          fetch "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            "$KUBECONFORM_SHA256" kubeconform.tgz
          tar -xzf "$RUNNER_TEMP/kubeconform.tgz" -C "$bin" kubeconform
          fetch "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz" \
            "$HELMFILE_SHA256" helmfile.tgz
          tar -xzf "$RUNNER_TEMP/helmfile.tgz" -C "$bin" helmfile
          fetch "https://github.com/kubernetes-sigs/cloud-provider-kind/releases/download/v${CPK_VERSION}/cloud-provider-kind_${CPK_VERSION}_linux_amd64.tar.gz" \
            "$CPK_SHA256" cpk.tgz
          tar -xzf "$RUNNER_TEMP/cpk.tgz" -C "$bin" cloud-provider-kind
          echo "$bin" >> "$GITHUB_PATH"

      - name: Write the instance's .env
        env:
          INSTANCE_ENV: ${{ secrets.instance_env }}
        run: |
          set -euo pipefail
          if [ -n "$INSTANCE_REPOSITORY" ]; then
            dir="$GITHUB_WORKSPACE/instance-repository/$INSTANCE_PATH"
          else
            dir="$GITHUB_WORKSPACE/base-platform/$INSTANCE_PATH"
          fi
          [ -d "$dir" ] || { echo "::error::no instance directory $INSTANCE_PATH"; exit 1; }
          echo "INSTANCE_DIR=$dir" >> "$GITHUB_ENV"
          if [ -n "$INSTANCE_ENV" ]; then
            printf '%s\n' "$INSTANCE_ENV" > "$dir/.env"
          elif [ -f "$dir/.env.example" ]; then
            # Throwaway values for a cluster that lives as long as this run.
            # Hex only: some are put into a URL unescaped.
            while IFS= read -r line; do
              case "$line" in
                [A-Z]*=*) printf '%s%s\n' "${line%%=*}=" "$(openssl rand -hex 24)" ;;
              esac
            done < "$dir/.env.example" > "$dir/.env"
          else
            echo "::error::no instance_env secret and no .env.example in $INSTANCE_PATH"
            exit 1
          fi

      - name: Bring the base up
        run: BASE_ROOT="$GITHUB_WORKSPACE" ./base-platform/scripts/k8s-up.sh "$INSTANCE_DIR"

      - name: Run the system test
        run: BASE_ROOT="$GITHUB_WORKSPACE" ./base-platform/scripts/k8s-test.sh

      # `get all` lists no Secret; describe and logs of a Pod name Secrets,
      # never print them.
      - name: Collect the cluster's state
        if: failure()
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/cluster-state"
          mkdir -p "$out"
          kc() { kubectl --context kind-base "$@"; }
          kc get all -A -o wide > "$out/get-all.txt" 2>&1
          kc get events -A --sort-by=.lastTimestamp > "$out/events.txt" 2>&1
          kc get pods -A --no-headers 2>/dev/null |
            awk '{ split($3, r, "/"); if ($4 != "Completed" && (r[1] != r[2] || $4 != "Running")) print $1, $2 }' |
            while read -r ns pod; do
              kc -n "$ns" describe pod "$pod" > "$out/describe-$ns-$pod.txt" 2>&1
              kc -n "$ns" logs "$pod" --all-containers --tail=500 > "$out/logs-$ns-$pod.txt" 2>&1
            done
          cp "${XDG_CACHE_HOME:-$HOME/.cache}/base-kind/cloud-provider-kind.log" "$out/" 2>/dev/null || true
          ls "$out"

      - name: Upload the cluster's state
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-state
          path: ${{ runner.temp }}/cluster-state
          if-no-files-found: warn
