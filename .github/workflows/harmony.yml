name: harmony
# scripts/harmony.sh in CI (#25): every sibling checked out, the repository
# under test at its pull request, every gate run together (AGENTS-base.md
# Axiom 10).
#
# Reusable. A private repository calls it from its own workflow with
# `uses: PUC-Behring-AI/base-platform/.github/workflows/harmony.yml@vX.Y.Z`,
# `with: base_ref: vX.Y.Z` and `secrets: inherit` — the version its
# base-version.yaml pins (#38). base-platform and every base-* sibling are
# checked out at base_ref; the instance's own siblings at their default
# branch. The @ref alone does not do it: it picks this file, not what the
# file checks out. base_ref defaults to main, which is what base-platform's
# own runs (pull_request, push) use.
#
# Nothing here names a repository. Each repository's settings say which
# siblings to check, so this public file cannot tell which projects use the
# base:
#   - variable HARMONY_SIBLINGS: the sibling repository names, space-separated
#     (base-platform excluded: it is public and always checked out);
#   - secret HARMONY_KEY_<NAME> per sibling (base-knowledge →
#     HARMONY_KEY_BASE_KNOWLEDGE): the private half of a read-only deploy key
#     on that sibling. GITHUB_TOKEN cannot clone a second private repository.
# A missing variable or secret fails the run; it never skips a sibling.
#
# base-platform's own variable lists only base-* siblings: its logs are
# public, and harmony prints every repository it checks.
#
# On the Free plan a private repository cannot require this check; it reports.

on:
  workflow_call:
    inputs:
      base_ref:
        description: The base version the caller pins (vX.Y.Z); base-* repositories are checked out at it
        type: string
        default: main
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harmony:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository under test
        uses: actions/checkout@v4
        with:
          path: ${{ github.event.repository.name }}

      - name: Check out base-platform at base_ref
        if: github.event.repository.name != 'base-platform'
        uses: actions/checkout@v4
        with:
          repository: PUC-Behring-AI/base-platform
          ref: ${{ inputs.base_ref || 'main' }}
          path: base-platform

      - name: Check out every sibling, base-* at base_ref
        env:
          BASE_REF: ${{ inputs.base_ref || 'main' }}
          SIBLINGS: ${{ vars.HARMONY_SIBLINGS }}
          KEYS: ${{ toJSON(secrets) }}
          SELF: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "$SIBLINGS" ]; then
            echo "::error::repository variable HARMONY_SIBLINGS is not set"
            exit 1
          fi
          for name in $SIBLINGS; do
            [ "$name" = "$SELF" ] && continue
            secret="HARMONY_KEY_$(echo "$name" | tr '[:lower:]-' '[:upper:]_')"
            key="$(jq -r --arg s "$secret" '.[$s] // empty' <<<"$KEYS")"
            if [ -z "$key" ]; then
              echo "::error::secret $secret is not set"
              exit 1
            fi
            keyfile="$RUNNER_TEMP/$secret"
            printf '%s\n' "$key" > "$keyfile"
            chmod 600 "$keyfile"
            branch=()
            case "$name" in base-*) branch=(--branch "$BASE_REF") ;; esac
            GIT_SSH_COMMAND="ssh -i $keyfile -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
              git clone -q --depth 1 "${branch[@]}" "git@github.com:$OWNER/$name.git" "$name"
            rm -f "$keyfile"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # A sibling with a package.json is checked by the gate's Node step,
      # which fails unless the installed Node major equals that sibling's
      # .nvmrc. The runner's preinstalled Node is whatever the image ships,
      # so set up the one the siblings declare. Two .nvmrc files naming
      # different majors fail here, by name: one Node per run.
      - name: Find the Node version the siblings declare
        id: node
        run: |
          set -euo pipefail
          majors=""
          for f in */.nvmrc; do
            [ -f "$f" ] || continue
            major="$(tr -d '[:space:]v' < "$f")"; major="${major%%.*}"
            echo "$f: $major"
            majors="$(printf '%s\n%s' "$majors" "$major" | sed '/^$/d' | sort -u)"
          done
          if [ -z "$majors" ]; then
            echo "no .nvmrc in any sibling: no Node to set up"
            exit 0
          fi
          if [ "$(printf '%s\n' "$majors" | wc -l)" -ne 1 ]; then
            echo "::error::siblings declare different Node majors in .nvmrc: $(echo $majors)"
            exit 1
          fi
          echo "version=$majors" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.node.outputs.version != ''
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Install bats
        uses: bats-core/bats-action@3.0.0
        with:
          bats-version: "1.11.0"

      # The union of every gate's dependencies. base-knowledge is installed
      # as a package with its test module, the way its own CI does.
      - name: Install gate dependencies
        run: |
          pip install pytest pytest-cov pyyaml "jsonschema[format-nongpl]" referencing \
            ruff httpx uvicorn fastapi bcrypt "psycopg[binary]" psycopg-pool
          if [ -d base-knowledge ]; then
            pip install "./base-knowledge[dev]" -e ./base-knowledge/tests/fake_module
          fi

      # The chart step of the gate fails without helm and kubeconform. Pinned
      # the same way: by version and by sha256 of the release tarball.
      - name: Install helm and kubeconform
        env:
          HELM_VERSION: 4.3.1
          HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
          KUBECONFORM_VERSION: 0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$RUNNER_TEMP/helm.tgz" \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$HOME/.local/bin" --strip-components=1 linux-amd64/helm
          curl -sSfL -o "$RUNNER_TEMP/kubeconform.tgz" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tgz" -C "$HOME/.local/bin" kubeconform
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run harmony
        env:
          GATE_STRICT: "1"
        run: BASE_ROOT="$GITHUB_WORKSPACE" ./base-platform/scripts/harmony.sh "$GITHUB_WORKSPACE/${{ github.event.repository.name }}"
