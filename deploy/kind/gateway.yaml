# The cluster's one entry point: Gateway `base` in namespace `edge`, served by
# cloud-provider-kind. Only routes from a namespace labelled
# base.layer=interface attach to it (the interface chart's HTTPRoute).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: base
  namespace: edge
spec:
  gatewayClassName: cloud-provider-kind
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              base.layer: interface
