apiVersion: v1
kind: Pod
metadata:
  name: {{ include "postgres.fullname" . }}-test
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: pg-ready
      image: {{ include "postgres.image" . | quote }}
      command: ["pg_isready", "-h", {{ include "postgres.fullname" . | quote }}, "-p", "5432", "-U", {{ .Values.auth.username | quote }}]
