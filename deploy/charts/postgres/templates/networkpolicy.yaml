# Default deny for the database pod only; DNS out. Ingress from allowFrom and
# from this release's own helm test pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "postgres.fullname" . }}
  labels:
    {{- include "postgres.selector" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "postgres.database-selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- with .Values.allowFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - podSelector:
            matchLabels:
              {{- include "postgres.selector" . | nindent 14 }}
              app.kubernetes.io/component: test
      ports:
        - port: 5432
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
